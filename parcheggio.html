<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcheggio Facile</title>
  <meta name="theme-color" content="#2196f3">
  <meta name="color-scheme" content="light dark">
  <script>try { var t = localStorage.getItem('parcheggiTema'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { color-scheme: light; --bg: #f0f4f8; --card: #ffffff; --fg: #333333; --panel: #e9ecef; --muted: #555555; --line: #dde3ea; --selbg: #e8f3fd; --faint: #888888; --shadow: rgba(0,0,0,0.1); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0f1419; --card: #1a2129; --fg: #e6e9ec; --panel: #252f3a; --muted: #a3afbb; --line: #34404d; --selbg: #12304a; --faint: #7d8996; --shadow: rgba(0,0,0,0.5); } }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0f1419; --card: #1a2129; --fg: #e6e9ec; --panel: #252f3a; --muted: #a3afbb; --line: #34404d; --selbg: #12304a; --faint: #7d8996; --shadow: rgba(0,0,0,0.5); }
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: var(--bg); color: var(--fg); }
    :root[data-theme="dark"] button:not(#tema) { filter: brightness(0.9); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(#tema) { filter: brightness(0.9); } }
    #tema { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; padding: 0; margin: 0; border-radius: 50%; background: var(--panel); color: var(--fg); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    #installa { background-color: #673AB7; color: white; }
    .container { 
      max-width: 400px; 
      margin: 0 auto; 
      background: var(--card); 
      padding: 30px 20px; 
      border-radius: 16px; 
      box-shadow: 0 8px 20px var(--shadow);
      position: relative; /* Necessario per la X */
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; margin-top: 25px; }
    button { display: block; width: 100%; padding: 18px; margin: 10px 0; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    button:active { transform: scale(0.97); }
    #salva, #salvaFav { background-color: #4CAF50; color: white; }
    #salva.busy, #salvaFav.busy { background-color: #FF9800; }
    #apri { background-color: #2196F3; color: white; }
    #naviga { background-color: #009688; color: white; }
    #cancella { background-color: #f44336; color: white; font-size: 1rem; padding: 12px; }
    #copia { background-color: #FF9800; color: white; font-size: 1rem; padding: 12px; }
    #condividi { background-color: #9C27B0; color: white; font-size: 1rem; padding: 12px; }
    
    /* TASTINO X IN ALTO A DX */
    #chiudiX {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      background-color: #e0e0e0;
      color: #333;
      font-size: 1.4rem;
      line-height: 36px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #chiudiX:active { background-color: #bdbdbd; }

    .info { background: var(--panel); padding: 15px; border-radius: 10px; margin: 20px 0; min-height: 50px; }
    .info p { margin: 5px 0; font-size: 1rem; word-break: break-all; }
    .status { color: var(--muted); font-size: 0.9rem; margin-top: 10px; }
    .flex-row { display: flex; gap: 10px; }
    .flex-row button { flex: 1; padding: 14px; font-size: 1rem; }
    [hidden] { display: none !important; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    .disabled-btn { opacity: 0.5; pointer-events: none; }
    #rinomina { background-color: #3F51B5; color: white; font-size: 1rem; padding: 12px; }
    #ripristina { background-color: #607D8B; color: white; font-size: 1rem; padding: 12px; }
    #gestisci, #fine, #tutte { background-color: #78909C; color: white; font-size: 1rem; padding: 12px; }
    #scarica, #invia, #importa { background-color: #00796B; color: white; font-size: 1rem; padding: 12px; }
    #backupInfo { margin: 0 0 8px; text-align: left; }
    #cancSel, #cancTutte { background-color: #f44336; color: white; font-size: 1rem; padding: 12px; }
    h2 { font-size: 1rem; margin: 18px 0 6px; text-align: left; }
    .lista { text-align: left; }
    .riga { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 6px 0; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--card); }
    .riga.rapido { border-left: 7px solid #FFC107; }
    .riga.fav { border-left: 7px solid #FF9800; }
    .tabs { display: flex; gap: 8px; margin: 6px 0 4px; }
    .tab { flex: 1; margin: 0; padding: 12px; font-size: 1rem; background: var(--panel); color: var(--fg); }
    .tab.on { background: #2196F3; color: #fff; }
    .cart { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; text-align: left; }
    .cart-head { flex: 1; font-weight: bold; padding: 10px 12px; border-radius: 12px; background: var(--panel); cursor: pointer; word-break: break-word; }
    .mini { width: 42px; height: 42px; padding: 0; margin: 0; border-radius: 50%; font-size: 1.05rem; background: var(--panel); color: var(--fg); flex: none; display: flex; align-items: center; justify-content: center; }
    #nuovaCart { background-color: #795548; color: #fff; font-size: 1rem; padding: 12px; }
    #cartella { background-color: #FF9800; color: #fff; font-size: 1rem; padding: 12px; }
    dialog { border: none; border-radius: 16px; background: var(--card); color: var(--fg); width: 90%; max-width: 340px; padding: 18px; text-align: center; }
    dialog::backdrop { background: rgba(0,0,0,0.55); }
    dialog button { margin: 6px 0; padding: 14px; font-size: 1rem; }
    .riga.sel { border-color: #2196F3; background: var(--selbg); }
    .riga .nome { font-weight: bold; font-size: 1.05rem; }
    .riga .det { font-size: 0.8rem; color: var(--muted); }
    .riga input { width: 22px; height: 22px; flex: none; }
    .riga:focus-visible { outline: 3px solid var(--fg); }
    .vuota { color: var(--muted); padding: 8px 0; }
    .small-link { margin: 14px 0 0; font-size: 0.95rem; } .small-link a { color: #2196F3; font-weight: bold; }
    .brand { margin: 18px 0 0; font-size: 0.8rem; color: var(--faint); }
  </style>
</head>
<body>
  <div class="container">

    <button id="tema" aria-label="Cambia tema chiaro/scuro" title="Tema chiaro/scuro">🌙</button>
    <h1>🅿️ Parcheggio Facile</h1>
    <div class="tabs" id="tabs">
      <button class="tab on" id="tabPark">🅿️ Parcheggi</button>
      <button class="tab" id="tabFav">⭐ Preferiti</button>
    </div>

    <div id="viewPark">
      <button id="salva">📍 Salva posizione</button>
      <h2 id="titoloLista">Posizioni salvate</h2>
      <div class="lista" id="lista" role="listbox" aria-labelledby="titoloLista"></div>
    </div>

    <div id="viewFav" hidden>
      <button id="salvaFav">📍 Salva qui come preferito</button>
      <button id="nuovaCart">📁 Nuova cartella</button>
      <h2 id="titoloFav">Preferiti</h2>
      <div class="lista" id="favLista" role="listbox" aria-labelledby="titoloFav"></div>
    </div>

    <div class="info" id="info"><p>Nessuna posizione salvata</p></div>

    <div id="azioni">
      <button id="apri">🗺️ Apri in Maps</button>
      <button id="naviga">🚶 Naviga a piedi</button>
      <div class="flex-row">
        <button id="copia">📋 Copia coordinate</button>
        <button id="condividi">📤 Condividi</button>
      </div>
      <div class="flex-row">
        <button id="rinomina">✏️ Rinomina</button>
        <button id="cancella">🗑️ Cancella</button>
      </div>
      <button id="cartella">⭐ Aggiungi ai preferiti…</button>
      <button id="gestisci">☑️ Cancella più posizioni…</button>
    </div>

    <div id="modifica" hidden>
      <button id="tutte">☑️ Seleziona tutte</button>
      <button id="cancSel">🗑️ Cancella selezionate</button>
      <button id="cancTutte">🗑️ Cancella tutte</button>
      <button id="fine">✔️ Fine</button>
    </div>

    <div id="backup">
      <h2>Backup (consigliato)</h2>
      <p class="status" id="backupInfo"></p>
      <div class="flex-row">
        <button id="scarica">💾 Scarica file</button>
        <button id="invia">☁️ Invia a Drive…</button>
      </div>
      <button id="importa">📂 Importa da file</button>
      <input type="file" id="file" accept=".gpx,.xml,application/gpx+xml,application/xml,text/xml" hidden>
    </div>

    <dialog id="dlg">
      <h2 id="dlgTitolo" style="margin-top:0;text-align:center"></h2>
      <div id="dlgLista"></div>
      <button id="dlgAnnulla" style="background:var(--panel);color:var(--fg)">Annulla</button>
    </dialog>

    <button id="ripristina" hidden>↩️ Ripristina</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="status" id="installInfo"></p>
    <button id="installa">📲 Installa app</button>
    <p class="small-link"><a href="rapido.html">⚡ Parcheggio Rapido: un solo tocco per salvare</a></p>
    <p class="brand">by Lollo ®2026 · v1.8</p>
  </div>
<script>
(function() {
  'use strict';
  const el = id => document.getElementById(id);
  const status = text => { el('status').textContent = text; };
  const SKEY = 'parcheggiPosizioni', OLDKEY = 'posizioneParcheggio', OLDBKEY = 'posizioneParcheggioPrecedente';
  const MAX = 10, NAME_MAX = 30, MAXF = 20, MAXFAV = 100;
  let tab = 'park';
  let db = {items: [], sel: null, undo: [], fav: {folders: [], items: [], sel: null, undo: null}}, busy = false, editing = false, storageError = '';
  const checked = new Set();

  // ---------- Dati ----------
  function valid(p) {
    return p && typeof p === 'object' && Number.isFinite(p.lat) && Number.isFinite(p.lon)
      && Math.abs(p.lat) <= 90 && Math.abs(p.lon) <= 180;
  }
  const validItem = i => valid(i) && typeof i.name === 'string' && i.name && typeof i.id === 'string';
  function clean(raw) {
    const list = k => (raw && Array.isArray(raw[k]) ? raw[k] : []).filter(validItem).slice(0, MAX);
    const items = list('items'), undo = list('undo');
    const sel = raw && items.some(i => i.id === raw.sel) ? raw.sel : (items.length ? items[items.length - 1].id : null);
    return {items, sel, undo, rev: raw && Number.isFinite(raw.rev) ? raw.rev : 0, fav: cleanFav(raw)};
  }
  function cleanFav(raw) {
    const f = raw && raw.fav;
    const folders = (f && Array.isArray(f.folders) ? f.folders : []).filter(x => x && typeof x.id === 'string' && typeof x.name === 'string' && x.name).slice(0, MAXF);
    const ids = new Set(folders.map(x => x.id));
    const items = (f && Array.isArray(f.items) ? f.items : []).filter(i => validItem(i) && ids.has(i.folder)).slice(0, MAXFAV);
    const sel = f && items.some(i => i.id === f.sel) ? f.sel : (items.length ? items[0].id : null);
    let undo = null;
    if (f && f.undo && Array.isArray(f.undo.items)) {
      const fo = f.undo.folder && typeof f.undo.folder.id === 'string' && typeof f.undo.folder.name === 'string' ? {id: f.undo.folder.id, name: f.undo.folder.name} : null;
      const its = f.undo.items.filter(i => validItem(i) && typeof i.folder === 'string');
      if (fo || its.length) undo = {folder: fo, items: its};
    }
    return {folders, items, sel, undo};
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function migrate() {          // dalle versioni 1.x: posizione attuale -> P1, "precedente" -> P2
    const items = [];
    for (const key of [OLDKEY, OLDBKEY]) {
      try {
        const o = JSON.parse(localStorage.getItem(key));
        if (valid(o)) items.push({id: uid(), name: 'P' + (items.length + 1), lat: o.lat, lon: o.lon,
          accuracy: Number.isFinite(o.accuracy) ? o.accuracy : null, savedAt: Number.isFinite(o.savedAt) ? o.savedAt : Date.now()});
      } catch {}
    }
    const first = items.length ? items[0].id : null;
    items.sort((a, b) => a.savedAt - b.savedAt);
    return {items, sel: first, undo: [], rev: 0};
  }
  const persist = d => localStorage.setItem(SKEY, JSON.stringify(d));
  function load() {
    storageError = '';
    let raw = null;
    try { raw = localStorage.getItem(SKEY); }
    catch { db = clean(null); storageError = 'Memoria non accessibile: le posizioni non possono essere salvate.'; return; }
    if (raw === null) { db = clean(migrate()); if (db.items.length) { try { persist(db); } catch {} } return; }
    try { db = clean(JSON.parse(raw)); }
    catch { db = clean(null); storageError = 'Dati salvati non leggibili. Puoi riprovare a salvare la posizione.'; }
  }
  // modifica "atomica": lavora su una copia e la sostituisce solo se il salvataggio riesce
  function commit(fn) {
    const d = JSON.parse(JSON.stringify(db));
    try { fn(d); d.rev = (d.rev || 0) + 1; persist(d); } catch (e) { return e && e.message === 'FULL' ? 'full' : e && e.message === 'DUP' ? 'dup' : e && e.message === 'SAME' ? 'same' : 'err'; }
    db = d; return 'ok';
  }
  const nameTaken = (d, name, exceptId, list) => (list || d.items).some(i => i.id !== exceptId && i.name.toLowerCase() === name.toLowerCase());
  function freeName(d, prefix, list) { prefix = prefix || 'P'; for (let n = 1; ; n++) if (!nameTaken(d, prefix + n, null, list)) return prefix + n; }
  const isRapido = i => i && i.src === 'rapido';
  const iconOf = i => i && i.folder ? '⭐' : isRapido(i) ? '⚡' : '🅿️';
  const prefixOf = i => i && i.folder ? 'F' : isRapido(i) ? 'R' : 'P';
  const curPark = () => db.items.find(i => i.id === db.sel) || null;
  const curFav = () => db.fav.items.find(i => i.id === db.fav.sel) || null;
  const cur = () => tab === 'fav' ? curFav() : curPark();
  const folderName = id => { const f = db.fav.folders.find(x => x.id === id); return f ? f.name : ''; };
  const hasData = () => db.items.length || db.fav.items.length || db.fav.folders.length;
  const when = ts => Number.isFinite(ts) && Number.isFinite(new Date(ts).getTime())
    ? new Date(ts).toLocaleString('it-IT', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : '';
  const accText = i => Number.isFinite(i.accuracy) && i.accuracy >= 0 ? `±${Math.round(i.accuracy)} m` : '';

  // ---------- Schermo ----------
  const collapsed = new Set();
  function setSave(id, active, label) {
    const b = el(id);
    b.classList.toggle('busy', active);
    b.disabled = !!session && !active;
    b.textContent = !active ? label : (session && session.best ? `✅ Salva ora (±${Math.round(session.best.accuracy)} m)` : '✖ Annulla');
  }
  function addRow(parent, it, selected, extraClass, detail) {
    const row = document.createElement(editing ? 'label' : 'div');
    row.className = 'riga' + (selected ? ' sel' : '') + extraClass;
    row.dataset.id = it.id;
    if (editing) {
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = checked.has(it.id); row.appendChild(cb);
    } else { row.tabIndex = 0; row.setAttribute('role', 'option'); row.setAttribute('aria-selected', String(selected)); }
    const box = document.createElement('div');
    const n = document.createElement('div'); n.className = 'nome'; n.textContent = `${iconOf(it)} ${it.name}`;
    const dt = document.createElement('div'); dt.className = 'det'; dt.textContent = detail;
    box.append(n, dt); row.appendChild(box); parent.appendChild(row);
  }
  function miniBtn(text, act, label) {
    const b = document.createElement('button'); b.className = 'mini'; b.textContent = text; b.dataset.act = act; b.setAttribute('aria-label', label); return b;
  }
  function renderFav() {
    const f = db.fav, box = el('favLista'); box.replaceChildren();
    el('titoloFav').textContent = `Preferiti (${f.items.length}) · ${f.folders.length} ${f.folders.length === 1 ? 'cartella' : 'cartelle'}`;
    if (!f.folders.length) { const d = document.createElement('div'); d.className = 'vuota'; d.textContent = 'Nessuna cartella: creane una con «Nuova cartella» (es. Casa, Lavoro, Montagna), oppure salva un posto e scegli «Nuova cartella…».'; box.appendChild(d); return; }
    for (const fo of f.folders) {
      const its = f.items.filter(i => i.folder === fo.id).sort((a, b) => a.name.localeCompare(b.name, 'it', {numeric: true}));
      const open = !collapsed.has(fo.id);
      const head = document.createElement('div'); head.className = 'cart'; head.dataset.fid = fo.id;
      const t = document.createElement('div'); t.className = 'cart-head'; t.tabIndex = 0; t.setAttribute('role', 'button'); t.setAttribute('aria-expanded', String(open));
      t.textContent = `${open ? '📂' : '📁'} ${fo.name} (${its.length})`;
      head.append(t, miniBtn('✏️', 'ren', `Rinomina cartella ${fo.name}`), miniBtn('🗑️', 'del', `Cancella cartella ${fo.name}`));
      box.appendChild(head);
      if (open && !its.length) { const d = document.createElement('div'); d.className = 'vuota'; d.textContent = 'Cartella vuota'; box.appendChild(d); }
      if (open) for (const it of its) addRow(box, it, it.id === f.sel, ' fav', [when(it.savedAt), accText(it)].filter(Boolean).join(' · '));
    }
  }
  function render() {
    const items = db.items, fav = db.fav;
    if (!items.length) editing = false;
    if (editing) tab = 'park';
    for (const id of [...checked]) if (!items.some(i => i.id === id)) checked.delete(id);
    el('tabs').hidden = editing;
    el('tabPark').classList.toggle('on', tab === 'park'); el('tabFav').classList.toggle('on', tab === 'fav');
    el('viewPark').hidden = tab !== 'park'; el('viewFav').hidden = tab !== 'fav';
    el('titoloLista').textContent = `Posizioni salvate (${items.length}/${MAX})`;
    const lista = el('lista'); lista.replaceChildren();
    if (!items.length) { const d = document.createElement('div'); d.className = 'vuota'; d.textContent = 'Nessuna posizione salvata'; lista.appendChild(d); }
    for (const it of [...items].reverse()) addRow(lista, it, !editing && it.id === db.sel, isRapido(it) ? ' rapido' : '', [isRapido(it) ? 'Parcheggio Rapido' : '', when(it.savedAt), accText(it)].filter(Boolean).join(' · '));
    renderFav();
    const c = cur();
    el('info').replaceChildren();
    const lines = c ? [`${iconOf(c)} ${c.name}`] : [tab === 'fav' ? 'Nessun preferito selezionato' : 'Nessuna posizione selezionata'];
    if (c && c.folder) lines.push(`📁 ${folderName(c.folder)}`);
    if (c) lines.push(`Lat: ${c.lat.toFixed(6)}`, `Lon: ${c.lon.toFixed(6)}`);
    if (c && accText(c)) lines.push(`Precisione GPS: circa ${accText(c).slice(1)}`);
    if (c && when(c.savedAt)) lines.push(new Date(c.savedAt).toLocaleString('it-IT'));
    lines.forEach((text, k) => { const p = document.createElement('p'); p.textContent = text; if (c && k === 0) p.style.fontWeight = 'bold'; el('info').appendChild(p); });
    el('info').hidden = editing;
    el('azioni').hidden = editing; el('modifica').hidden = !editing;
    for (const id of ['apri','naviga','copia','condividi','rinomina','cancella','cartella']) el(id).disabled = !c || busy;
    el('cartella').textContent = tab === 'fav' ? '📁 Sposta in un’altra cartella…' : '⭐ Aggiungi ai preferiti…';
    el('gestisci').hidden = tab === 'fav';
    el('gestisci').disabled = !items.length || busy;
    el('cancSel').textContent = `🗑️ Cancella selezionate (${checked.size})`;
    el('cancSel').disabled = !checked.size;
    el('tutte').textContent = checked.size === items.length ? '☐ Deseleziona tutte' : '☑️ Seleziona tutte';
    const u = tab === 'fav' ? (fav.undo ? fav.undo : null) : (db.undo.length ? {folder: null, items: db.undo} : null);
    el('ripristina').hidden = !u || editing;
    el('ripristina').disabled = busy;
    if (u) el('ripristina').textContent = u.folder ? `↩️ Ripristina cartella «${u.folder.name}»${u.items.length ? ` (${u.items.length})` : ''}`
      : u.items.length === 1 ? `↩️ Ripristina «${u.items[0].name}»` : `↩️ Ripristina ${u.items.length} ${tab === 'fav' ? 'preferiti' : 'posizioni'} cancellati`;
    el('backup').hidden = editing;
    const bk = readBackupInfo();
    el('backupInfo').textContent = !hasData() && !bk ? 'Niente da salvare. Puoi importare un backup già fatto.'
      : !bk ? '⚠️ Nessun backup: se svuoti i dati del browser posizioni e preferiti si perdono. Scarica il file o invialo a Drive.'
      : bk.rev < (db.rev || 0) ? `⚠️ Ci sono modifiche dopo l’ultimo backup (${when(bk.at)}). Rifai il backup.`
      : `✅ Backup aggiornato (${when(bk.at)}).`;
    el('scarica').disabled = !hasData(); el('invia').disabled = !hasData();
    el('importa').disabled = busy;
    setSave('salva', !!session && !session.fav, '📍 Salva posizione');
    setSave('salvaFav', !!session && !!session.fav, '📍 Salva qui come preferito');
  }
  function select(id) {
    if (editing) return;
    if (tab === 'fav') { if (id === db.fav.sel || !db.fav.items.some(i => i.id === id)) return; db.fav.sel = id; }
    else { if (id === db.sel || !db.items.some(i => i.id === id)) return; db.sel = id; }
    try { persist(db); } catch {} render(); status('');
  }

  // Invece di un solo fix (spesso grossolano, da celle/Wi-Fi) seguiamo il GPS per qualche secondo

  const GOOD_M = 10;        // precisione "ottima": stop immediato
  const OK_M = 30;          // precisione "buona": stop se non migliora piu'
  const STALL_MS = 8000;    // tempo senza miglioramenti per fermarsi a OK_M

    const cand = {lat: c.latitude, lon: c.longitude, accuracy: Number.isFinite(c.accuracy) && c.accuracy >= 0 ? c.accuracy : Infinity, savedAt: now};

    status(`Precisione attuale ${shown(cand.accuracy)}, migliore ${shown(session.best.accuracy)}. Resta all’aperto…`);

    const park = db.items.map(i => wpt(i, isRapido(i) ? 'Parcheggio Rapido' : 'Parcheggio', isRapido(i) ? '<sorgente>rapido</sorgente>' : '', ''));
    const fav = db.fav.items.map(i => wpt(i, 'Preferito', '<preferito>1</preferito>', folderName(i.folder)));
    const meta = db.fav.folders.length ? `  <metadata>\n    <extensions>${db.fav.folders.map(f => `<cartella>${esc(f.name)}</cartella>`).join('')}</extensions>\n  </metadata>\n` : '';
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Parcheggio Facile by Lollo ®2026" xmlns="http://www.topografix.com/GPX/1/1">\n${meta}${[...park, ...fav].join('\n')}\n</gpx>\n`;
  }
  const backupName = () => `parcheggio-facile-backup-${new Date().toISOString().slice(0, 10)}.gpx`;
  function markBackup() { try { localStorage.setItem(BKINFO, JSON.stringify({at: Date.now(), rev: db.rev || 0})); } catch {} render(); }
  el('scarica').addEventListener('click', () => {
    if (!hasData()) return;
    const url = URL.createObjectURL(new Blob([toGpx()], {type: 'application/gpx+xml'}));
    const a = document.createElement('a'); a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    markBackup(); status('Backup scaricato (cartella Download). Per metterlo anche su Drive usa «Invia a Drive».');
  });
  el('invia').addEventListener('click', async () => {
    if (!hasData()) return;
    const file = new File([toGpx()], backupName(), {type: 'application/gpx+xml'});
    try {
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file], title: 'Backup Parcheggio Facile'});
        markBackup(); status('Backup inviato.'); return;
      }
    } catch (error) { if (error.name === 'AbortError') { status('Invio annullato.'); return; } }
    el('scarica').click();
    status('Questo browser non può inviare file direttamente: ho scaricato il backup. Aprilo da «File» e condividilo su Drive.');
  });
  function parseGpx(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('xml');
    const txt = (node, tag) => { const n = node.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
    const clean1 = t => t.replace(/\s+/g, ' ').trim().slice(0, NAME_MAX);
    const park = [], fav = [], folders = [];
    for (const n of doc.getElementsByTagName('cartella')) { const f = clean1(n.textContent); if (f) folders.push(f); }
    for (const w of doc.getElementsByTagName('wpt')) {
      const ac = parseFloat(txt(w, 'precisione')), tm = Date.parse(txt(w, 'time'));
      const it = {lat: parseFloat(w.getAttribute('lat')), lon: parseFloat(w.getAttribute('lon')),
        name: clean1(txt(w, 'name')),
        accuracy: Number.isFinite(ac) && ac >= 0 ? ac : null, savedAt: Number.isFinite(tm) ? tm : Date.now()};
      if (!valid(it)) continue;
      if (txt(w, 'preferito').trim() === '1') { it.folderName = clean1(txt(w, 'type')) || 'Preferiti'; fav.push(it); continue; }
      if (txt(w, 'sorgente').trim() === 'rapido') it.src = 'rapido';
      park.push(it);
    }
    return {park, fav, folders};
  }
  function uniqueName(d, name, prefix, list) {
    if (!name) return freeName(d, prefix, list);
    if (!nameTaken(d, name, null, list)) return name;
    for (let k = 2; k < 100; k++) { const n = name.slice(0, NAME_MAX - 5) + ` (${k})`; if (!nameTaken(d, n, null, list)) return n; }
    return freeName(d, prefix, list);
  }
  el('importa').addEventListener('click', () => { if (!busy) { el('file').value = ''; el('file').click(); } });
  el('file').addEventListener('change', async () => {
    const f = el('file').files[0]; if (!f) return;
    let data;
    try { if (f.size > 1e6) throw new Error('big'); data = parseGpx(await f.text()); }
    catch { status('File non valido: scegli un backup GPX di Parcheggio Facile.'); return; }
    if (!data.park.length && !data.fav.length && !data.folders.length) { status('Nel file non ci sono posizioni.'); return; }
    let added = 0, addedFav = 0, dup = 0, full = 0;
    const r = commit(d => {
      added = addedFav = dup = full = 0;
      for (const it of data.park) {
        if (d.items.some(x => Math.abs(x.lat - it.lat) < 1e-6 && Math.abs(x.lon - it.lon) < 1e-6)) { dup++; continue; }
        if (d.items.length >= MAX) { full++; continue; }
        it.id = uid(); it.name = uniqueName(d, it.name, prefixOf(it)); d.items.push(it); d.sel = it.id; added++;
      }
      d.items.sort((a, b) => a.savedAt - b.savedAt);
      const folderId = name => { try { return ensureFolder(d, {newName: name}); } catch { return null; } };
      for (const name of data.folders) folderId(name);
      for (const it of data.fav) {
        const fid = folderId(it.folderName);
        if (!fid) { full++; continue; }
        if (d.fav.items.some(x => x.folder === fid && Math.abs(x.lat - it.lat) < 1e-6 && Math.abs(x.lon - it.lon) < 1e-6)) { dup++; continue; }
        if (d.fav.items.length >= MAXFAV) { full++; continue; }
        const item = {id: uid(), folder: fid, name: uniqueName(d, it.name, 'F', d.fav.items), lat: it.lat, lon: it.lon, accuracy: it.accuracy, savedAt: it.savedAt};
        d.fav.items.push(item); d.fav.sel = item.id; addedFav++;
      }
    });
    render();
    if (r !== 'ok') { status('Importazione non riuscita: memoria non accessibile.'); return; }
    status(`Importate ${added} posizioni e ${addedFav} preferiti.` + (dup ? ` ${dup} già presenti.` : '') + (full ? ` ${full} non importati: elenco pieno o limite raggiunto.` : ''));
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}   // chiede al browser di non cancellare i dati da solo
  // ---------- Punti salvati da «Parcheggio Rapido» (rapido.html, stessa cartella = stessa memoria) ----------
  const RKEY = 'parcheggioRapido', SETTLE_MS = 90000;
  let rapidoTimer = null;
  function readRapido() {
    try { const a = JSON.parse(localStorage.getItem(RKEY)); return Array.isArray(a) ? a.filter(r => valid(r) && typeof r.id === 'string') : []; } catch { return []; }
  }
  function importRapido() {
    clearTimeout(rapidoTimer);
    if (busy) return;
    const now = Date.now(), all = readRapido();
    // un punto è "pronto" se Rapido ha finito di migliorarlo (fin) o non lo aggiorna da un po'
    const ready = all.filter(r => r.fin || now - (r.upd || r.savedAt || 0) > SETTLE_MS);
    const waiting = all.filter(r => !ready.includes(r));
    if (waiting.length) rapidoTimer = setTimeout(importRapido, SETTLE_MS + 500);
    if (!ready.length) return;
    const known = new Set(db.items.map(i => i.id));
    const todo = ready.filter(r => !known.has('r' + r.id)).sort((a, b) => (a.savedAt || 0) - (b.savedAt || 0));
    let added = [];
    const left = new Set();
    const res = commit(d => {
      added = []; left.clear();
      for (const x of todo) {
        if (d.items.length >= MAX) { left.add(x.id); continue; }
        const it = {id: 'r' + x.id, src: 'rapido', name: freeName(d, 'R'), lat: x.lat, lon: x.lon, accuracy: Number.isFinite(x.accuracy) ? x.accuracy : null, savedAt: Number.isFinite(x.savedAt) ? x.savedAt : now};
        d.items.push(it); d.sel = it.id; added.push(it);
      }
    });
    if (res !== 'ok') return;
    try { localStorage.setItem(RKEY, JSON.stringify([...waiting, ...ready.filter(r => left.has(r.id))])); } catch {}   // se fallisce, l'id evita doppioni
    render();
    if (added.length) status(`Importato da Parcheggio Rapido: ${added.map(i => `${i.name}${accText(i) ? ' (' + accText(i) + ')' : ''}`).join(', ')}.` + (left.size ? ` ${left.size} in attesa: elenco pieno (${MAX}).` : ''));
    else if (left.size) status(`${left.size} punti di Parcheggio Rapido in attesa: elenco pieno (${MAX}), cancellane qualcuno.`);
  }
  window.addEventListener('storage', event => {
    if (event.key === SKEY || event.key === null) { load(); render(); status(storageError || 'Posizioni aggiornate.'); }
    if (event.key === RKEY || event.key === null) importRapido();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') importRapido(); });
  window.addEventListener('focus', importRapido);
  const web = ['https:','http:'].includes(location.protocol);
  let installPrompt = null;
  const installed = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (installed()) el('installa').hidden = true;
  window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; });
  el('installa').addEventListener('click', async () => {
    if (installPrompt) {
      const prompt = installPrompt; installPrompt = null;
      try { await prompt.prompt(); const choice = await prompt.userChoice; el('installInfo').textContent = choice.outcome === 'accepted' ? 'Installazione richiesta.' : 'Installazione annullata.'; }
      catch { el('installInfo').textContent = 'Apri il menu del browser (⋮) e scegli «Installa app» o «Aggiungi alla schermata Home».'; }
      return;
    }
    el('installInfo').textContent = !web || !window.isSecureContext ? 'Per installare pubblica l’app su un indirizzo HTTPS e aprila da lì.'
      : /iphone|ipad|ipod/i.test(navigator.userAgent) ? 'Su iPhone/iPad: tocca Condividi (quadrato con freccia), poi «Aggiungi alla schermata Home».'
      : 'Apri il menu del browser (⋮) e scegli «Installa app» o «Aggiungi alla schermata Home».';
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; el('installa').hidden = true; el('installInfo').textContent = 'App installata.'; });
  // ---------- Tema chiaro/scuro (segue il telefono; il pulsante 🌙/☀️ forza una scelta) ----------
  const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : !!(darkMq && darkMq.matches); };
  function themeUi() {
    el('tema').textContent = isDark() ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = isDark() ? '#1a2129' : '#2196f3';
  }
  el('tema').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('parcheggiTema', next); } catch {}
    themeUi();
  });
  if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', themeUi);
  themeUi();
  
  if (web && window.isSecureContext && 'serviceWorker' in navigator) {
    el('installInfo').textContent = 'Per installare: menu del browser → Aggiungi alla schermata Home.';
    navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      el('installInfo').textContent = 'App pronta anche offline. Per installare: menu del browser → Aggiungi alla schermata Home. Le mappe richiedono una connessione.';
    }).catch(() => { el('installInfo').textContent = 'Modalità offline non disponibile: verifica che tutti i file dell’app siano pubblicati.'; });
  } else {
    el('installInfo').textContent = 'File locale: per un’icona Home stabile e la modalità offline occorre pubblicare il pacchetto completo su HTTPS.';
  }
  load(); render(); status(storageError || (db.items.length ? 'Posizioni memorizzate.' : ''));
  importRapido();
})();
</script>
